[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-personal-agent"
version = "0.1.0"
description = "Multimodal Personal AI Agent with Hybrid Graph-Vector Memory, Zero-LLM Tool Pruning, Edge-Cloud Privacy Routing, and Audited State Machine"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
